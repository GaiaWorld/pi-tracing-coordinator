[package]
name = "pi-tracing-coordinator"
version = "0.1.0"
authors = ["vmos <vmos@fairblock.io>"]
edition = "2021"
description = "A implements for coordinating tracing across multiple processes."
repository = "https://github.com/GaiaWorld/pi-tracing-coordinator"
license = "MIT OR Apache-2.0"
keywords = ["pi", "tracing", "coordinator"]

[dependencies]
pi_service = { version = "0.6", registry = "yn" }
pi_logger = "0.11"
fory = "0.14"
fory-core = "0.14"
anyhow = "1.0"
tracing = "0.1"
futures = "0.3"

[dev-dependencies]
# slice-binding：经公开start构造双真实记录器，复用锁定SDK，仅用于测试。
opentelemetry_sdk = { version = "=0.33.0", default-features = false, features = ["trace"] }

# slice-final R1：经授权以真实生产宿主验证收发与异步错误，仅用于测试。
pi_p2p_service = { version = "0.3", registry = "yn" }
pi_p2p = { version = "1.3", registry = "yn" }
